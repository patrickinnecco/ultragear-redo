name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 7.0.x

      - name: Publish single-file exe
        run: dotnet publish source/Ultragear.csproj -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: Ultragear
          path: publish/Ultragear.exe

      - name: Attach exe to the GitHub release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/Ultragear.exe
